[project]
name = "native-browser-control"
version = "0.2.0"
description = "Native Chrome/Edge automation without Selenium using pywinauto"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mss>=10.1.0",
    "pillow>=12.2.0",
    "pywin32>=312",
    "pywinauto>=0.6.9",
    "tqdm>=4.66.4",
    "regex>=2026.1.15"
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0,<2",
]

[tool.uv]
package = true


[tool.setuptools]

[tool.setuptools.packages.find]
include = ["native_browser_control*"]

[project.scripts]
native-browser-control = "native_browser_control.cli:main"

[build-system]
requires = ["setuptools==80.9.0", "wheel"]
build-backend = "setuptools.build_meta"
